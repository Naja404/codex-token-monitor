name: Release macOS and Windows apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  windows-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Codex-Token-Monitor-Windows-x64
          path: dist
      - name: Attach Windows ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Codex-Token-Monitor-Windows-x64.zip --repo "$GITHUB_REPOSITORY"

  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release --arch arm64

      - name: Run regression tests
        run: swift test

      - name: Assemble app bundle
        run: |
          APP="dist/Codex Token Monitor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/arm64-apple-macosx/release/CodexTokenMonitor "$APP/Contents/MacOS/"
          cp Packaging/Info.plist "$APP/Contents/Info.plist"
          cp Assets/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp -R .build/arm64-apple-macosx/release/CodexTokenMonitor_CodexTokenMonitor.bundle "$APP/Contents/Resources/"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/CodexTokenMonitor" --verify-resources
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Codex-Token-Monitor-macOS-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Token-Monitor-macOS-arm64
          path: dist/Codex-Token-Monitor-macOS-arm64.zip

      # Only the locally Developer ID signed, notarized and stapled macOS ZIP
      # belongs on a public release. Never upload the ad-hoc CI ZIP to Releases.
      - name: Prepare draft release for notarized package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
